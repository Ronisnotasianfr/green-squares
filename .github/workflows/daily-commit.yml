name: Daily Commit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Random sleep
        run: |
          MINUTES=$((RANDOM % 60))
          HOURS=$((RANDOM % 24))
          echo "Sleeping for ${HOURS}h ${MINUTES}m..."
          sleep $((HOURS * 3600 + MINUTES * 60))

      - name: Update log
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "- $DATE" >> log.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add log.md
          git diff --staged --quiet || git commit -m "daily commit: $(date -u '+%Y-%m-%d')"
          git push
